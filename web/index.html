<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#f4f6fb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0e14" media="(prefers-color-scheme: dark)">
  <meta name="format-detection" content="telephone=no">
  <title>One More Speedtest</title>
  <meta name="description" content="A simple, self-hosted internet speed test: ping, jitter, download and upload.">
  <meta name="application-name" content="Speedtest">
  <meta name="apple-mobile-web-app-title" content="Speedtest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="favicon.ico" sizes="32x32">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
  <script src="theme.js"></script>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
          <path d="M5 22a11 11 0 0 1 22 0" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
          <path d="M16 22l6-8" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
          <circle cx="16" cy="22" r="2.5" fill="currentColor"/>
        </svg>
        <span>one more <strong>speedtest</strong></span>
      </div>
      <button class="client" id="client-info" type="button" title="Copy to clipboard" aria-live="polite" hidden></button>
    </header>

    <section class="controls" aria-label="Test settings">
      <fieldset class="segmented" id="connections">
        <legend>Connections</legend>
        <label><input type="radio" name="connections" value="single"><span>Single</span></label>
        <label><input type="radio" name="connections" value="multi" checked><span>Multi</span></label>
      </fieldset>
      <fieldset class="segmented" id="duration">
        <legend>Duration</legend>
        <label><input type="radio" name="duration" value="basic" checked><span>Basic</span></label>
        <label><input type="radio" name="duration" value="long"><span>Long run</span></label>
      </fieldset>
    </section>
    <p class="mode-hint" id="mode-hint"></p>

    <section class="stage">
      <div class="gauge" id="gauge" data-phase="idle">
        <svg viewBox="0 0 300 256" aria-hidden="true">
          <defs>
            <linearGradient id="grad-download" x1="0" y1="1" x2="1" y2="0">
              <stop offset="0" class="s-download-a"/>
              <stop offset="1" class="s-download-b"/>
            </linearGradient>
            <linearGradient id="grad-upload" x1="0" y1="1" x2="1" y2="0">
              <stop offset="0" class="s-upload-a"/>
              <stop offset="1" class="s-upload-b"/>
            </linearGradient>
          </defs>
          <path class="gauge-track" id="gauge-track"/>
          <path class="gauge-fill" id="gauge-fill"/>
          <g id="gauge-ticks"></g>
        </svg>
        <div class="gauge-center">
          <button class="start" id="start" type="button">Go</button>
          <div class="readout" id="readout" hidden>
            <span class="readout-phase" id="readout-phase"></span>
            <span class="readout-value" id="readout-value">0</span>
            <span class="readout-unit" id="readout-unit">Mbps</span>
            <span class="readout-latency" id="readout-latency"></span>
          </div>
        </div>
      </div>
      <div class="progress" aria-hidden="true"><div class="progress-bar" id="progress-bar"></div></div>
      <div class="status-row">
        <p class="status" id="status" aria-live="polite">Press Go to start the test</p>
        <button class="link" id="cancel" type="button" hidden>Cancel</button>
      </div>
    </section>

    <section class="metrics" aria-label="Results">
      <article class="metric" id="m-ping">
        <h2>Ping</h2>
        <p><span class="value" data-value>—</span><span class="unit">ms</span></p>
        <dl class="loaded" title="Ping measured while the link is busy">
          <div class="loaded-caption">Under load</div>
          <div class="loaded-download"><dt>Down</dt><dd data-loaded="download">—</dd></div>
          <div class="loaded-upload"><dt>Up</dt><dd data-loaded="upload">—</dd></div>
        </dl>
      </article>
      <article class="metric" id="m-jitter">
        <h2>Jitter</h2>
        <p><span class="value" data-value>—</span><span class="unit">ms</span></p>
        <dl class="loaded" title="Jitter measured while the link is busy">
          <div class="loaded-caption">Under load</div>
          <div class="loaded-download"><dt>Down</dt><dd data-loaded="download">—</dd></div>
          <div class="loaded-upload"><dt>Up</dt><dd data-loaded="upload">—</dd></div>
        </dl>
      </article>
      <article class="metric metric-download" id="m-download">
        <h2><i class="dot"></i>Download</h2>
        <p><span class="value" data-value>—</span><span class="unit">Mbps</span></p>
        <canvas class="spark" data-spark></canvas>
      </article>
      <article class="metric metric-upload" id="m-upload">
        <h2><i class="dot"></i>Upload</h2>
        <p><span class="value" data-value>—</span><span class="unit">Mbps</span></p>
        <canvas class="spark" data-spark></canvas>
      </article>
    </section>

    <footer class="footer">
      <span>Self-hosted · no trackers · no third-party requests</span>
      <span aria-hidden="true">·</span>
      <a class="quiet-link" href="monitor" title="Endless ping test that records drops, lost pings and jitter">Stability monitor</a>
      <fieldset class="segmented theme-switch" id="theme">
        <legend>Theme</legend>
        <label title="Auto: follow the system"><input type="radio" name="theme" value="auto" aria-label="Auto theme" checked><span><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 2.5a5.5 5.5 0 0 1 0 11z" fill="currentColor"/></svg></span></label>
        <label title="Light"><input type="radio" name="theme" value="light" aria-label="Light theme"><span><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.5v1.2M8 13.3v1.2M1.5 8h1.2M13.3 8h1.2M3.4 3.4l.85.85M11.75 11.75l.85.85M3.4 12.6l.85-.85M11.75 4.25l.85-.85" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></span></label>
        <label title="Dark"><input type="radio" name="theme" value="dark" aria-label="Dark theme"><span><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M14 8.53A6 6 0 1 1 7.47 2 4.67 4.67 0 0 0 14 8.53z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg></span></label>
      </fieldset>
    </footer>
  </main>

  <dialog class="results" id="results" aria-labelledby="results-title">
    <form method="dialog" class="results-close"><button aria-label="Close" type="submit">&times;</button></form>
    <h2 id="results-title">Your results</h2>
    <img class="results-image" id="results-image" alt="Speed test results card">
    <div class="results-actions">
      <button class="btn btn-primary" id="save-image" type="button">Download image</button>
      <button class="btn" id="copy-image" type="button">Copy image</button>
      <button class="btn btn-ghost" id="again" type="button">Test again</button>
    </div>
    <p class="results-note" id="results-note" aria-live="polite"></p>
  </dialog>

  <div class="toast" id="toast" role="status" hidden></div>

  <script src="app.js" type="module"></script>
</body>
</html>
