name: Registry cleanup

# Removes old image versions from ghcr.io/<owner>/one-more-speedtest:
#   - sha-* tags beyond the 10 newest (dev builds from main)
#   - untagged versions: old dev-latest builds, leftovers of the above, and old
#     provenance attestations
# Platform manifests (amd64, arm64) that belong to a tagged image are untagged
# too, but the action detects them and never deletes them.
# Release tags (latest, 1.2.3, 1.2, 1) and dev-latest are never touched.
#
# Run it by hand from the Actions tab with "dry run" on to see what would go.
on:
  schedule:
    - cron: "30 3 * * 0" # weekly, Sunday 03:30 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only log what would be deleted
        type: boolean
        default: true

permissions:
  packages: write

concurrency:
  group: registry-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          package: one-more-speedtest
          delete-tags: sha-*
          keep-n-tagged: 10
          delete-untagged: true
          # Scheduled runs have no inputs, so they really delete.
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
