name: Docker

# Image tags published to ghcr.io/<owner>/one-more-speedtest:
#   tag v1.2.3       -> 1.2.3, 1.2, 1, latest (no latest for pre-releases like v1.3.0-rc.1)
#   push to main     -> dev-latest
#   pull request     -> built only, never pushed
# Old untagged versions are removed by registry-cleanup.yml.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Image name
        # Registry paths must be lowercase; the owner name may not be.
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=raw,value=dev-latest,enable={{is_default_branch}}
            type=ref,event=pr

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Buildx adds a provenance attestation per platform by default. In GHCR
          # each one shows up as an extra untagged "sha256:..." version, so turn
          # them off. A push now creates one tagged index plus one untagged
          # manifest per platform (amd64, arm64); those two are required.
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
